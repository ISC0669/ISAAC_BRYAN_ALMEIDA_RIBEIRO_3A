<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carros</title>
</head>
<body>

    <h2>Modelos de carros</h2>

    <table border="1" id="tabela">
        <tr>
            <th>Marca</th>
            <th>Modelo</th>
        </tr>
    </table>

    <script>
        let carros = [
            ["Toyota", "Corolla"],
            ["Toyota", "Yaris"],
            ["Toyota", "Hilux"],

            ["Honda", "Civic"],
            ["Honda", "City"],
            ["Honda", "HR-V"],

            ["Volkswagen", "Golf"],
            ["Volkswagen", "Polo"],
            ["Volkswagen", "T-Cross"],

            ["Ford", "Mustang"],
            ["Ford", "Ranger"],
            ["Ford", "Territory"]
        ];

        let tabela = document.getElementById("tabela");

        for (let i = 0; i < carros.length; i++) {

            let linha = document.createElement("tr");

            let marca = document.createElement("td");
            marca.textContent = carros[i][0];

            let modelo = document.createElement("td");
            modelo.textContent = carros[i][1];

            linha.appendChild(marca);
            linha.appendChild(modelo);

            tabela.appendChild(linha);

            // A cada 3 carros, cria uma linha separadora
            if ((i + 1) % 3 === 0 && i < carros.length - 1) {

                let linhaSeparadora = document.createElement("tr");

                let colunaSeparadora = document.createElement("td");

                colunaSeparadora.colSpan = 2;

                let hr = document.createElement("hr");

                colunaSeparadora.appendChild(hr);
                linhaSeparadora.appendChild(colunaSeparadora);

                tabela.appendChild(linhaSeparadora);
            }
        }
    </script>
</body>
</html>
